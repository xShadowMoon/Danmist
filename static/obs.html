<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雾幕 · OBS 弹幕</title>
<link rel="stylesheet" href="static/fonts/fonts.css">
<style>
/* OBS 页面没有画布底色。预览背景只属于 obs-setup 的外层容器。 */
:root {
  --size: 18px; --card: rgba(16,22,32,.7); --bg-alpha: .7;
  --ink: #f6f8fc; --ink2: #c4cfdf; --shadow: 0 1px 2px #0005;
  --g3: #70afff; --g2: #bd8cf4; --g1: #ff905e;
  --avatar-size: 46px; --gap: 10px; --radius: 12px;
  --card-shadow: 0 4px 12px #0002;
}
html, body { margin: 0; height: 100%; background: transparent !important; overflow: hidden; }
body { font: 400 var(--size)/var(--lh, 1.5) var(--ff, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif); color: var(--ink); }
.light { --ink: #233044; --ink2: #526176; --shadow: none; --g3: #326fc9; --g2: #8544bb; --g1: #c74f28; }
.square { --radius: 6px; }
#list { position: absolute; inset: auto 0 0; padding: 12px; will-change: transform; display: flex; flex-direction: column; align-items: flex-start; gap: var(--gap); }
.right #list { align-items: flex-end; }
.it { --rgb: var(--pal-rgb, 169 188 213); --accent: var(--pal-ink, var(--ink2)); position: relative; box-sizing: border-box; max-width: 100%; display: flex; align-items: flex-start; gap: .65em; padding: .6em .7em; border: 1px solid rgb(var(--rgb) / .23); border-radius: var(--radius); background: var(--card); color: var(--ink); text-shadow: var(--shadow); box-shadow: var(--card-shadow); animation: slidein var(--anim-ms, .6s) cubic-bezier(.22, 1, .36, 1) backwards; }
.it.dm, .it.gift { width: 100%; }
.fitwidth .it.dm, .fitwidth .it.gift { width: fit-content; }
.it.g3 { --rgb: 76 151 247; --accent: var(--g3); }
.it.g2 { --rgb: 165 94 232; --accent: var(--g2); }
.it.g1 { --rgb: 245 111 56; --accent: var(--g1); }
.it.g3, .it.g2, .it.g1 { border-color: rgb(var(--rgb) / .58); background: linear-gradient(115deg,rgb(var(--rgb) / calc(var(--bg-alpha) * .15)),transparent 75%),var(--card); }
.dm[class*=" g"]::before { content: ''; position: absolute; top: -1px; left: 12px; right: 45%; height: 1px; background: linear-gradient(90deg,transparent,rgb(var(--rgb) / .9),transparent); pointer-events: none; }
.body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: .4em; margin: .02em 0 .2em; line-height: 1.4; }
.name { font-size: .76em; font-weight: 600; color: var(--accent); overflow-wrap: anywhere; }
.txt { display: block; line-height: 1.5; letter-spacing: .01em; }
.txt img.emo { height: 1.45em; vertical-align: -.32em; margin: 0 .04em; }
.txt img:not(.emo) { height: 2.2em; max-width: 100%; object-fit: contain; vertical-align: middle; }
.rank { font-size: .56em; line-height: 1.5; color: var(--accent); padding: 0 .45em; border: 1px solid rgb(var(--rgb) / .4); border-radius: 4px; white-space: nowrap; margin-left: auto; letter-spacing: .08em; text-shadow: none; }
.rank3 { --accent: var(--g3); --rgb: 76 151 247; } .rank2 { --accent: var(--g2); --rgb: 165 94 232; } .rank1 { --accent: var(--g1); --rgb: 245 111 56; }
/* 粉丝牌：B 站新版样式（半透明底色 + 右边实色等级块，舰长牌子有亮边） */
.medal { --mb: var(--mc); display: inline-flex; align-items: center; font-size: .57em; line-height: 1.5; border-radius: .4em; padding-right: .08em; text-shadow: none; flex: none;
  background: color-mix(in srgb, var(--mc) 60%, transparent); border: 1px solid var(--mb); }
.medal b { color: #fff; padding: 0 .4em 0 .45em; font-weight: 500; white-space: nowrap; }
.medal i { font-style: normal; color: #fff; background: color-mix(in srgb, var(--mc) 90%, transparent); border-radius: .32em; padding: 0 .35em; min-width: 1.4em; text-align: center; font-weight: 700; }
.identity { display: inline-flex; align-items: center; gap: 4px; flex: none; align-self: flex-start; }
.portrait { position: relative; width: var(--avatar-size); height: var(--avatar-size); display: grid; place-items: center; flex: none; border-radius: 50%; isolation: isolate; box-sizing: border-box; }
.av { width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%; object-fit: cover; background: #8fb6dc; display: grid; place-items: center; font-size: calc(var(--avatar-size) * .42); color: #fff; font-weight: 600; text-shadow: none; }
.tier3 { --frame-color: #5b9cf0; } .tier2 { --frame-color: #a86ae3; } .tier1 { --frame-color: #f5773f; }
.identity[class*="tier"] .portrait { padding: 3px; border: 2px solid var(--frame-color); }
.identity .portrait.has-art { border: 0; padding: 0; }
.has-art .av { width: 78%; height: 78%; }
.avatar-frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 1; }
.gicon { flex: none; object-fit: contain; width: calc(var(--avatar-size) * .52); height: calc(var(--avatar-size) * .52); filter: drop-shadow(0 1px 1px #0003); }
.gtag { font-size: .57em; border-radius: 4px; padding: .1em .3em; color: #fff; text-shadow: none; background: var(--frame-color,#598ed5); flex: none; }
.noav .portrait { display: none; }
.noav .identity:not([class*="tier"]), .noav.nobadge .identity { display: none; }
.noframe .avatar-frame { display: none; }
.noframe .identity .portrait { border: 0; padding: 0; }
.noframe .has-art .av { width: 100%; height: 100%; }
.nobadge .identity > .gicon, .nobadge .identity > .gtag { display: none; }
.norank .rank { display: none; }
.nonames .who .name { display: none; }
.inline .who { display: inline-flex; margin: 0 .4em 0 0; vertical-align: middle; }
.inline .rank { margin-left: 0; }
.inline .txt { display: inline; }
.inline .it.dm { align-items: center; }
.gift { align-items: center; }
.giftverb { font-size: .85em; color: var(--ink2); }
.gift .gi { width: 2em; height: 2em; object-fit: contain; flex: none; }
.gift .num, .rep { color: #ffb983; font-weight: 600; margin-left: .2em; display: inline-block; }
.light .gift .num, .light .rep { color: #b35b24; }
.gift .yuan { font-size: .75em; color: var(--ink2); margin-left: .35em; }
.gift.big { border-color: #db945a77; }
.sc { width: 100%; min-width: 0; padding: 0; flex-direction: column; align-items: stretch; gap: 0; overflow: hidden; color: #fff; text-shadow: none; background: none; border-color: #a8c5dd66; }
.sc .h { display: flex; align-items: center; gap: .6em; padding: .55em .7em; background: color-mix(in srgb,var(--sc-tone,#427d9e) 55%,#172332) !important; }
.sc .name { flex: 1; }
.sc .p { margin-left: auto; font-size: .86em; font-weight: 600; white-space: nowrap; }
.sc .m { padding: .6em .8em .7em; background: color-mix(in srgb,var(--sc-tone,#5a95b5) 55%,#223246) !important; border-top: 1px solid #bfd6eb20; line-height: 1.55; overflow-wrap: anywhere; }
.no-sc-bg .sc, .no-sc-bg .sc .h, .no-sc-bg .sc .m { background: none !important; box-shadow: none; }
.no-sc-bg .sc { color: var(--ink); text-shadow: var(--shadow); }
.no-sc-bg.light:not(.plain) .sc .name { color: var(--ink) !important; }
.guardbuy { align-items: center; color: #fff; background-size: cover; background-position: center; overflow: hidden; }
.guardbuy.l3 { background: linear-gradient(110deg,#366cb7,#689cde); }
.guardbuy.l2 { background: linear-gradient(110deg,#7542ad,#ad7edb); }
.guardbuy.l1 { background: linear-gradient(110deg,#b53730,#f37e3d); }
.guardbuy small { display: block; font-size: .75em; }
.guardbuy.artbanner { background-color: transparent; background-size: 100% 100%; background-repeat: no-repeat; border: 0; border-radius: 0; overflow: visible; box-shadow: none; width: 21em; max-width: 100%; padding: 2% 33% 0 15%; text-shadow: 0 0 3px #4a2a55,0 1px 2px #4a2a55; }
.artbanner .body { width: 100%; flex: initial; }
.artbanner .l1, .artbanner small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artbanner .l1 { font-size: 1.05em; font-weight: 700; }
.enter { font-size: .82em; align-items: center; padding: .45em .7em; }
.enter .name { font-size: 1em; }
.enter .portrait { width: calc(var(--avatar-size) * .8); height: calc(var(--avatar-size) * .8); }
/* 关闭底色后，连大礼物和大航海的渐变也去掉；边框由独立开关决定。 */
.no-bubble .it.dm, .no-bubble .it.gift, .no-bubble .it.enter { background: none !important; box-shadow: none; }
.no-border .it:not(.guardbuy) { border-color: transparent; }
.no-border .dm::before { display: none; }
.no-border .sc .m { border-color: transparent; }
.no-shadow .it { box-shadow: none; }
.plain { --ink: #fff; --ink2: #dfeaf6; --g3: #82bcff; --g2: #c39cff; --g1: #ffa079; --shadow: 0 0 2px #000,0 0 2px #000,0 1px 3px #000c; }
.plain .it.dm, .plain .it.gift, .plain .it.enter { background: none !important; border-color: transparent; box-shadow: none; padding: .25em .2em; }
.plain .dm::before { display: none; }
.it.out { opacity: 0; transition: opacity .6s; }
.anim-fade .it { animation-name: fadein; }
.anim-none .it { animation: none; }
.anim-pop .it { animation-name: popin; }
.anim-left .it { animation-name: leftin; }
.anim-right .it { animation-name: rightin; }
@keyframes popin { from { opacity: 0; transform: scale(.82); } 60% { transform: scale(1.03); } }
@keyframes leftin { from { opacity: 0; transform: translateX(-1.6em); } }
@keyframes rightin { from { opacity: 0; transform: translateX(1.6em); } }
.hasms .it:not(.g1):not(.artbanner) { animation-duration: var(--anim-ms) !important; }
.bump { animation: bump .35s ease-out; }
@keyframes slidein { from { opacity: 0; transform: translateY(.8em); } }
@keyframes fadein { from { opacity: 0; } }
@keyframes bump { 40% { transform: scale(1.18); } }
@media(prefers-reduced-motion:reduce) { .it, .bump { animation: none !important; } }

/* ===== 风格 A「雾月」：居中、细线、徽章式上舰 ===== */
.theme-luna #list { align-items: center; }
.theme-luna .it:not(.artbanner) { border: 0; box-shadow: none; background: none; }
.theme-luna .it.artbanner { align-self: center; }
.theme-luna.anim-slide .it { animation: lunain .5s cubic-bezier(.2, .8, .2, 1); }
.theme-luna .it.artbanner.l1 { animation: lunain .5s cubic-bezier(.2, .8, .2, 1), bannerglow 1.6s ease-in-out .5s 2; }
@keyframes lunain { from { opacity: 0; transform: translateY(.7em) scale(.97); filter: blur(4px); } }
@keyframes bannerglow { 50% { filter: drop-shadow(0 0 .7em #ffd27a); } }
.theme-luna .it.dm { width: auto; flex-direction: column; align-items: center; text-align: center; gap: .1em; padding: .15em .5em; }
.theme-luna .dm::before { display: none; }
/* 2026-11-21 用户：雾月字太小看不清 —— 名字行、弹幕都调大，字外面一圈深色外框（text-shadow 画，OBS 旧浏览器也不会吃细笔画）；
   在设置里自己调了描边 / 阴影就用设置的 */
.theme-luna .lw { font-size: .8em; font-weight: 700; letter-spacing: .08em; }
.theme-luna:not(.ts) .lw .name, .theme-luna:not(.ts) .dm .txt, .theme-luna:not(.ts) .lcard .name, .theme-luna:not(.ts) .lm { text-shadow: var(--xo); }
.theme-luna:not(.ts) .dm.g2 .txt, .theme-luna:not(.ts) .dm.g1 .txt { filter: drop-shadow(.05em 0 0 var(--xo-c)) drop-shadow(-.05em 0 0 var(--xo-c)) drop-shadow(0 .05em 0 var(--xo-c)) drop-shadow(0 -.05em 0 var(--xo-c)) drop-shadow(0 0 .3em rgba(150, 125, 255, .5)); }
.theme-luna .lcard .name { font-size: .88em; } .theme-luna .lm { font-size: 1em; } .theme-luna .lk { font-size: .58em; }
.lw { display: flex; align-items: center; justify-content: center; gap: .4em; font-size: .68em; letter-spacing: .12em; color: var(--accent); }
.lw::before, .lw::after { content: ""; width: 2.6em; height: 1px; background: linear-gradient(90deg, transparent, currentColor); opacity: .8; }
.lw::after { transform: scaleX(-1); }
.lw .name { font-size: 1em; color: inherit; }
.lw .lav { width: 2.1em; height: 2.1em; flex: none; border-radius: 50%; box-shadow: 0 0 0 1.5px currentColor, 0 2px 6px #0006; }
.lw .lav .av { font-size: .9em; letter-spacing: 0; text-shadow: none; }
.noav .lw .lav { display: none; }
.nonames .lw .name { display: none; }
.nobadge .lw .gicon, .nobadge .lw .gtag { display: none; }
.lw .gicon { width: 1.5em; height: 1.5em; }
.lw .medal { font-size: .82em; }
.theme-luna .it.dm:not([class*=" g"]) { --accent: #cdd8ea; }
.theme-luna .dm .txt { font-size: 1.14em; font-weight: 600; color: #fff; text-shadow: 0 0 10px rgb(var(--rgb) / .5), 0 1px 2px #000b; }
.theme-luna .dm.g3 .txt { color: #e6f1ff; }
.theme-luna .dm.g2 .txt, .theme-luna .dm.g1 .txt { -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 1px 1px #0009) drop-shadow(0 0 6px rgb(var(--rgb) / .5)); }
.theme-luna .dm.g2 .txt { background-image: linear-gradient(90deg, #e9dcff, #fff, #d6bcff); }
.theme-luna .dm.g1 .txt { background-image: linear-gradient(90deg, #ffe3a3, #fffaf0, #ffc25e); }
.lcard { --tone: 236 196 120; width: min(100%, 23em); box-sizing: border-box; position: relative; overflow: hidden; display: flex; align-items: center; gap: .7em; padding: .7em 1.1em .85em .75em; border-radius: 14px;
  background: linear-gradient(135deg, rgb(var(--tone) / .34), rgba(14, 18, 36, .6) 72%); border: 1px solid rgb(var(--tone) / .45); box-shadow: 0 8px 26px #0005; text-shadow: 0 1px 2px #0008; }
.lcard::before { content: ""; position: absolute; right: -2.2em; bottom: -2.4em; width: 6.5em; height: 6.5em; border-radius: 50%; border: 1px solid rgb(var(--tone) / .28); box-shadow: inset 0 0 0 .55em rgb(var(--tone) / .05), inset 0 0 0 .6em rgb(var(--tone) / .22); pointer-events: none; }
.lcard::after { content: ""; position: absolute; left: 1em; right: 1em; bottom: .35em; border-bottom: 1px dashed rgb(var(--tone) / .45); }
.lcard .portrait { --avatar-size: 2.4em; }
.lcard .lb { flex: 1; min-width: 0; }
.lk { font-size: .52em; letter-spacing: .32em; color: rgb(var(--tone)); font-weight: 600; }
.lcard .name { font-size: .78em; color: #fff; }
.lm { font-size: .92em; line-height: 1.5; overflow-wrap: anywhere; }
.wm { position: absolute; right: .5em; top: -.05em; font: 200 2.3em/1.2 Georgia, "Times New Roman", serif; letter-spacing: -.02em; color: rgb(var(--tone)); opacity: .2; pointer-events: none; }
.lcard .num { color: rgb(var(--tone)); font-weight: 700; }
.theme-luna .it.lcard { border: 1px solid rgb(var(--tone) / .45); background: linear-gradient(135deg, rgb(var(--tone) / .34), rgba(14, 18, 36, .6) 72%); box-shadow: 0 8px 26px #0005; }
.lguard { --tone: 140 190 255; flex-direction: column; align-items: center; text-align: center; gap: .25em; padding: .5em 1em .2em; }
.lguard.l2 { --tone: 196 160 255; } .lguard.l1 { --tone: 255 204 120; }
.emb { position: relative; width: 4.6em; height: 4.6em; display: grid; place-items: center; margin-bottom: .2em; }
.emb img, .emb .av { width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 1; }
.emb::before { content: ""; position: absolute; inset: -.45em; border-radius: 50%; border: 1px solid rgb(var(--tone) / .7); box-shadow: 0 0 1.4em rgb(var(--tone) / .55), inset 0 0 1em rgb(var(--tone) / .25); }
.l2 .emb::after, .l1 .emb::after { content: ""; position: absolute; inset: -1em; border-radius: 50%; border: 1px dashed rgb(var(--tone) / .55); animation: spin 8s linear 1; }
.l1 .emb { filter: drop-shadow(0 0 .8em rgb(255 190 90 / .6)); }
.l1 .emb > .rays { position: absolute; inset: -1.8em; border-radius: 50%; background: repeating-conic-gradient(rgb(255 214 140 / .32) 0 4deg, transparent 4deg 22deg); -webkit-mask: radial-gradient(circle, transparent 42%, #000 46%, transparent 70%); mask: radial-gradient(circle, transparent 42%, #000 46%, transparent 70%); animation: spin 14s linear 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.lguard.shine .llv { animation: glowt 1.6s ease-in-out 2; }
@keyframes glowt { 50% { text-shadow: 0 0 1.4em rgb(var(--tone)), 0 1px 2px #000a; } }
.lcap { font-size: .5em; letter-spacing: .45em; color: rgb(var(--tone)); }
.llv { font-size: 1.15em; letter-spacing: .55em; padding-left: .55em; font-weight: 700; color: rgb(var(--tone)); text-shadow: 0 0 .6em rgb(var(--tone) / .7), 0 1px 2px #000a; }
.lpill { margin-top: .15em; font-size: .78em; padding: .18em 1.1em; border-radius: 999px; border: 1px solid rgb(var(--tone) / .6); background: rgba(10, 14, 28, .62); color: #fff; }
.theme-luna .it.enter { width: auto; padding: .1em .5em; font-size: .75em; color: var(--ink2); }
.theme-luna .it.enter .identity { display: none; }

/* ===== 2026-11-21 新样式（用户挑的）：月见 moon、雾凇 rime、星扣 clip（雾月系，居中、半透明）；气泡 bubble、票根 ticket（靠左的卡片）
   字的外圈用 text-shadow 画（OBS 旧浏览器的 -webkit-text-stroke 会把字吃细）；头像、粉丝牌、名字、身份、头像框都跟着开关走 ===== */
:root { --xo-c: rgba(26, 18, 60, .86); --xo: .07em 0 0 var(--xo-c), -.07em 0 0 var(--xo-c), 0 .07em 0 var(--xo-c), 0 -.07em 0 var(--xo-c), .05em .05em 0 var(--xo-c), -.05em .05em 0 var(--xo-c), .05em -.05em 0 var(--xo-c), -.05em -.05em 0 var(--xo-c), 0 0 .45em rgba(150, 125, 255, .55); }
.theme-xw .it { border: 0; background: none; box-shadow: none; padding: 0; }
.theme-xw .dm::before { display: none; }
.xw-moon #list, .xw-rime #list, .xw-clip #list { align-items: center; }
.theme-xw .it.dm { flex-direction: column; align-items: center; text-align: center; gap: .12em; width: auto; }
.theme-xw .it.dm .body { display: flex; flex-direction: column; align-items: center; gap: .12em; }
.theme-xw .txt { font-size: 1.08em; font-weight: var(--fw, 600); color: #fff; text-shadow: var(--xo); }
.theme-xw .it.g2 .txt { color: #f4ecff; } .theme-xw .it.g1 .txt { color: #fff5df; }
.theme-xw .name { font-size: .74em; font-weight: 700; color: var(--xn, #fff); text-shadow: var(--xo); letter-spacing: .03em; white-space: nowrap; }
.theme-xw .it.g3 { --xn: #b4d8ff; --tr: 142 197 255; } .theme-xw .it.g2 { --xn: #e2ccff; --tr: 201 168 255; } .theme-xw .it.g1 { --xn: #ffdca8; --tr: 255 194 122; }
.theme-xw .xn { display: flex; align-items: center; justify-content: center; gap: .4em; }
.theme-xw .rank { margin: 0; font-size: .52em; color: #fff; border: 0; background: rgb(var(--tr, 150 150 200) / .85); text-shadow: none; }
.theme-xw .xstar { width: .62em; height: .72em; flex: none; fill: #fff7d6; filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 4px rgba(200, 170, 255, .9)); }
.theme-xw .xmoon { width: .78em; height: .78em; flex: none; fill: #fff3c8; filter: drop-shadow(0 0 3px rgba(255, 240, 190, .9)); }
.theme-xw .xflake { width: .7em; height: .7em; flex: none; stroke: #fff; stroke-width: 1.8; fill: none; filter: drop-shadow(0 0 2px rgba(190, 210, 255, 1)); }
.theme-xw .xclip { width: .95em; height: .95em; flex: none; filter: drop-shadow(0 0 2px rgba(255, 220, 130, .8)); }
/* 头像 + 发夹圆扣 + 斜体等级（有粉丝牌、或者是舰长的人才有这一行） */
.theme-xw .xf { display: flex; align-items: center; gap: .3em; }
.theme-xw .xr { position: relative; width: calc(var(--avatar-size) * .82); height: calc(var(--avatar-size) * .82); border-radius: 50%; padding: 2px; box-sizing: border-box; background: conic-gradient(from 200deg, #fff, #cdbfff, #a9cfff, #fff); box-shadow: 0 0 .5em rgba(190, 170, 255, .8); flex: none; }
.theme-xw .xr .av { border: 1.5px solid rgba(255, 255, 255, .9); font-size: calc(var(--avatar-size) * .36); }
.theme-xw .xr .xclip { position: absolute; right: -.25em; top: -.2em; width: .8em; height: .8em; }
.theme-xw .xr .xstar { position: absolute; left: -.25em; bottom: -.1em; width: .5em; height: .58em; }
.theme-xw .xl { display: flex; flex-direction: column; line-height: 1; text-align: left; }
.theme-xw .xl b { font: italic 800 1.1em/1 Georgia, "Times New Roman", serif; color: #fff; text-shadow: var(--xo); }
.theme-xw .xl small { font-size: .5em; font-weight: 700; color: #efe8ff; text-shadow: var(--xo); letter-spacing: .08em; margin-top: .1em; white-space: nowrap; }
.theme-xw .xl.dim b, .theme-xw .xl.dim small { color: #c9ccd6; }

/* 星扣：名字在小胶囊里，胶囊头是主播的发夹圆扣，两边星点 */

/* 气泡：白色聊天气泡、深色字，名字在气泡上面 */
.xw-bubble .it.dm { flex-direction: row; align-items: flex-end; text-align: left; gap: .45em; }

.xw-bubble .bav { width: calc(var(--avatar-size) * .78); height: calc(var(--avatar-size) * .78); flex: none; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); }

.xw-bubble .xn { justify-content: flex-start; margin-left: .55em; }
.xw-bubble .txt { color: #2b2850; text-shadow: none; font-size: 1em; font-weight: var(--fw, 500); background: rgba(255, 255, 255, calc(.35 + var(--bg-alpha) * .6)); padding: .32em .75em; border-radius: 1em 1em 1em .25em; box-shadow: 0 3px 10px rgba(0, 0, 0, .25); }
.xw-bubble .it.g3 .txt { color: #24324f; background: rgba(230, 240, 255, calc(.35 + var(--bg-alpha) * .6)); box-shadow: 0 0 0 2px #8ebcff, 0 3px 10px rgba(0, 0, 0, .25); }
.xw-bubble .it.g2 .txt { color: #33244f; background: rgba(240, 232, 255, calc(.35 + var(--bg-alpha) * .6)); box-shadow: 0 0 0 2px #c7a8ff, 0 3px 10px rgba(0, 0, 0, .25); }
.xw-bubble .it.g1 .txt { color: #4a2c00; background: rgba(255, 244, 220, calc(.35 + var(--bg-alpha) * .6)); box-shadow: 0 0 0 2px #ffc27a, 0 3px 10px rgba(0, 0, 0, .25); }
.xw-bubble .medal { font-size: .56em; }
/* 票根：浅色小票，左边一截撕口（放头像），中间一道虚线 */
.xw-ticket .it.dm { flex-direction: row; align-items: stretch; text-align: left; gap: 0; border-radius: .55em; overflow: hidden; box-shadow: 0 4px 12px rgba(0, 0, 0, .28); background: rgba(255, 253, 248, calc(.35 + var(--bg-alpha) * .6)); color: #2d2a44;
  -webkit-mask: radial-gradient(circle .38em at 2.9em 0, transparent 98%, #000) top/100% 51% no-repeat, radial-gradient(circle .38em at 2.9em 100%, transparent 98%, #000) bottom/100% 51% no-repeat; }
.xw-ticket .tav { flex: none; width: 2.9em; display: grid; place-items: center; background: #ece6ff; border-right: 2px dashed #b9add9; }
.xw-ticket .tav .av { width: 1.75em; height: 1.75em; font-size: .8em; }
.xw-ticket .it.dm .body { align-items: flex-start; padding: .35em .8em .4em; gap: .05em; }
.xw-ticket .xn { justify-content: flex-start; }
.xw-ticket .dm .name { color: #7a6bc4; text-shadow: none; }
.xw-ticket .txt { color: #2d2a44; text-shadow: none; font-size: 1em; font-weight: var(--fw, 500); }
.xw-ticket .it.g3 .tav { background: #dfeaff; } .xw-ticket .dm.g3 .name { color: #3f74d6; }
.xw-ticket .it.g2 .tav { background: #efe2ff; } .xw-ticket .dm.g2 .name { color: #8a4fd6; }
.xw-ticket .it.g1 .tav { background: #ffe9cc; } .xw-ticket .dm.g1 .name { color: #c46a10; }
.xw-ticket .medal { font-size: .56em; }
/* 礼物卡（五个新样式共用）：半透明淡紫卡，左边发夹圆扣圆章，背景月相一圈 + 雪花 */
.theme-xw .it.xgift { width: min(100%, 22em); display: flex; align-items: center; gap: .65em; padding: .55em .8em .75em; border-radius: .8em; overflow: hidden; position: relative;
  background: linear-gradient(120deg, rgba(214, 200, 255, calc(.15 + var(--bg-alpha) * .35)), rgba(240, 234, 255, calc(.1 + var(--bg-alpha) * .22)) 55%, rgba(190, 210, 255, calc(.12 + var(--bg-alpha) * .3))); border: 1px solid rgba(255, 255, 255, .6); box-shadow: 0 6px 18px rgba(40, 20, 90, .25); }
.theme-xw .xgift .xmc { position: absolute; right: -2em; top: -2.2em; width: 8.5em; height: 8.5em; opacity: .5; pointer-events: none; }
.theme-xw .xgift .xbadge { position: relative; width: 2.6em; height: 2.6em; flex: none; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff4c4, #f3c75e 60%, #d9a23a); box-shadow: 0 0 0 2px rgba(255, 255, 255, .85), 0 0 .6em rgba(255, 214, 120, .8); }
.theme-xw .xgift .xbadge::after { content: ""; position: absolute; left: 22%; right: 22%; top: 42%; height: 16%; border-radius: 1em; background: #7a4c12; }
.noav.theme-xw .xgift .xbadge .av { display: none; }
.theme-xw .xgift .xbadge .av { position: absolute; inset: 12%; width: 76%; height: 76%; font-size: .9em; z-index: 1; }
.theme-xw .xgift .body { flex: 1; min-width: 0; position: relative; display: block; text-align: left; }
.theme-xw .xgift .name { display: block; font-size: .78em; }
.theme-xw .xgift .gl2 { font-size: .9em; font-weight: 600; color: #fff; text-shadow: var(--xo); }
.theme-xw .xgift .gl2 b { color: #ffe08a; }
.theme-xw .xgift .num { color: #ffe08a; }
.theme-xw .xgift .gi { width: 2.2em; height: 2.2em; object-fit: contain; flex: none; position: relative; }
.theme-xw .xgift .yen { position: absolute; right: .7em; top: .45em; font-size: .62em; font-weight: 700; color: #fff; text-shadow: var(--xo); }
/* gift_line=1：礼物卡只占一行（打游戏时少挡一块） */
.giftline.theme-xw .it.xgift { width: auto; max-width: 100%; padding: .3em .8em .3em .35em; gap: .45em; border-radius: 999px; }
.giftline.theme-xw .xgift .xmc, .giftline.theme-xw .xgift .deco, .giftline.theme-xw .xgift .yen { display: none; }
.giftline.theme-xw .xgift .xbadge { width: 1.5em; height: 1.5em; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .85); }
.giftline.theme-xw .xgift .body { display: flex; align-items: center; gap: .4em; white-space: nowrap; }
.giftline.theme-xw .xgift .name { display: inline; font-size: .8em; }
.giftline.theme-xw .xgift .gl2 { font-size: .85em; }
.giftline.theme-xw .xgift .gi { width: 1.5em; height: 1.5em; }
/* 整体靠左 / 靠右（2026-11-25，所有样式都能选；居中的样式内部也跟着靠边） */
.al-left #list { align-items: flex-start !important; }
.al-right #list { align-items: flex-end !important; }
.al-center #list { align-items: center !important; }
.al-left .it.dm, .al-left .it.dm .body, .al-left .it.xbuy, .al-left .lguard { align-items: flex-start !important; text-align: left !important; }
.al-right .it.dm, .al-right .it.dm .body, .al-right .it.xbuy, .al-right .lguard { align-items: flex-end !important; text-align: right !important; }
.al-left .xn, .al-left .lw, .al-left .theme-xw .xf { justify-content: flex-start !important; }
.al-right .xn, .al-right .lw { justify-content: flex-end !important; }
.al-left .it.artbanner, .al-left .it.xbuy, .al-left .it.lguard { align-self: flex-start !important; }
.al-right .it.artbanner, .al-right .it.xbuy, .al-right .it.lguard { align-self: flex-end !important; }
.al-right.xw-bubble .it.dm, .al-right.xw-ticket .it.dm { flex-direction: row-reverse; }
.al-right.xw-bubble .it.dm .xn, .al-right.xw-ticket .it.dm .xn { justify-content: flex-end; }
/* 礼物卡大小（gift_size）；太长的礼物条换行，不超出 OBS 源（2026-11-25） */
.it.gift, .it.xgift, .it.sc, .it.xsc, .it.lcard, .it.guardbuy, .it.xbuy { font-size: calc(1em * var(--gs, 1)); }
.it.gift .body, .it.xgift .body, .it.xgift .name, .it.gift .name { min-width: 0; overflow-wrap: anywhere; }
.giftline.theme-xw .xgift .body { flex-wrap: wrap; white-space: normal !important; row-gap: 0; }
.giftline.theme-xw .it.xgift { border-radius: 1.1em; }
/* 名字太长不换成好几行：最多 12 个字宽，多的用省略号（2026-11-25） */
.it .name { max-width: 12em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: bottom; }
/* 其他平台的标签（2026-11-25） */
.plat { display: inline-block; font-size: .55em; font-weight: 700; line-height: 1.6; padding: 0 .45em; margin-left: .3em; border-radius: .4em; color: #fff; text-shadow: none; vertical-align: middle; flex: none; }
.plat.p-douyu { background: #ff7a1f; } .plat.p-huya { background: #f6a609; }
/* 刷屏时（一秒超过 6 条）不放进场动画，省电脑（2026-11-25） */
.flood .it, .flood .it * { animation: none !important; }
/* 荣耀等级（wealth=1，2026-11-21）：B 站的等级勋章图，名字旁边 */
.wl { height: 1.05em; width: auto; vertical-align: -.18em; flex: none; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .35)); }
.wlp { display: inline-flex; align-items: center; font-size: .55em; font-weight: 700; color: #fff; background: var(--w, #8d6cf0); border-radius: .4em; padding: 0 .4em; line-height: 1.6; text-shadow: none; flex: none; }
.theme-xw .xgift .deco { position: absolute; left: 1em; right: 1em; bottom: .3em; height: .35em; background: radial-gradient(circle, rgba(255, 255, 255, .95) 1.2px, transparent 1.7px) 0 50%/.55em .35em repeat-x; }
.xw-bubble .it.xgift, .xw-ticket .it.xgift { width: min(100%, 20em); }
/* SC：SUPER CHAT 横幅 + 金额，颜色按 B 站的档位 */
.theme-xw .it.xsc { width: min(100%, 22em); flex-direction: column; align-items: stretch; gap: 0; border-radius: .8em; overflow: hidden; border: 1px solid rgb(var(--tone) / .85); box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
.theme-xw .xsc .st { display: flex; align-items: center; gap: .55em; padding: .4em .7em; background: linear-gradient(90deg, rgb(var(--tone) / .8), rgb(var(--tone) / .55)); }
.theme-xw .xsc .cap { font-size: .56em; font-weight: 800; letter-spacing: .25em; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .4); }
.theme-xw .xsc .name { font-size: .8em; }
.theme-xw .xsc .p { margin-left: auto; font: 800 .95em/1 Georgia, serif; color: #fff; text-shadow: var(--xo); }
.theme-xw .xsc .sb { padding: .4em .8em .5em; background: rgb(var(--tone) / .25); font-size: .95em; font-weight: 600; color: #fff; text-shadow: var(--xo); text-align: center; overflow-wrap: anywhere; }
.no-sc-bg.theme-xw .xsc { border-color: transparent; box-shadow: none; } .no-sc-bg.theme-xw .xsc .st, .no-sc-bg.theme-xw .xsc .sb { background: none; }
/* 上舰、进房 */
.theme-xw .it.xbuy { flex-direction: column; align-items: center; gap: .1em; text-align: center; padding: .4em 1.4em .5em; border-radius: .8em; background: radial-gradient(closest-side, rgb(var(--tr) / .35), transparent); }
.theme-xw .xbuy .lv { font-size: 1.1em; font-weight: 800; letter-spacing: .4em; padding-left: .4em; color: var(--xn); text-shadow: var(--xo); }
.theme-xw .xbuy .who2 { font-size: .8em; color: #fff; text-shadow: var(--xo); }
.theme-xw .it.enter { font-size: .78em; color: #fff; text-shadow: var(--xo); gap: .35em; align-items: center; }
.theme-xw .it.enter .name { font-size: 1em; }
/* 用了文字设置里的描边 / 阴影时，用设置的；颜色设置照旧生效 */
.ts.theme-xw .txt, .ts.theme-xw .name, .ts.theme-xw .xl b, .ts.theme-xw .xsc .sb, .ts.theme-xw .gl2 { text-shadow: var(--ts) !important; }
/* 浅色卡片里的深色字（气泡、票根的正文）：描白边，不然黑边糊成一团（2026-11-25） */
.ts.xw-bubble .dm .txt, .ts.xw-ticket .dm .txt { text-shadow: var(--ts-card, none) !important; }
/* 票根的提督、总督正文以前被通用的浅色字盖掉，浅底浅字看不清（2026-11-25） */
.xw-ticket .it.dm.g2 .txt, .xw-ticket .it.dm.g1 .txt, .xw-ticket .it.dm.g3 .txt { color: #2d2a44; }
.xw-bubble .txt, .xw-ticket .txt, .xw-ticket .dm .name { text-shadow: none !important; }
/* ===== 风格 B「流光」：左对齐玻璃条，左侧色条分等级（2026-11-21 用户不要了，旧网址自动换成月见；样式先留着不删） ===== */
.theme-glass .it:not(.guardbuy) { --rgb: 214 224 240; border: 0; border-radius: 10px; background: linear-gradient(90deg, rgb(var(--rgb) / .16), rgba(12, 16, 26, .64) 42%); box-shadow: inset 3px 0 0 rgb(var(--rgb) / .55), 0 6px 18px #0003; }
.theme-glass .it.g3:not(.guardbuy), .theme-glass .it.g2:not(.guardbuy), .theme-glass .it.g1:not(.guardbuy) { background: linear-gradient(90deg, rgb(var(--rgb) / .32), rgba(12, 16, 26, .64) 48%); box-shadow: inset 3px 0 0 rgb(var(--rgb)), 0 0 18px rgb(var(--rgb) / .18), 0 6px 18px #0003; }

.theme-glass .dm::before { display: none; }
.theme-glass .it.dm:not([class*=" g"]) .name { color: #c9d4e6; }
.theme-glass .it.g2 .name, .theme-glass .it.g1 .name { -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
.theme-glass .it.g2 .name { background-image: linear-gradient(90deg, #d7c0ff, #fff, #b994ff); }
.theme-glass .it.g1 .name { background-image: linear-gradient(90deg, #ffd27a, #fff4d6, #ffaf45); }
.theme-glass .it.g1 { animation: slidein .25s ease-out, glowg 1.6s ease-in-out .3s 2; }
@keyframes glowg { 50% { box-shadow: inset 3px 0 0 rgb(var(--rgb)), 0 0 30px rgb(var(--rgb) / .5), 0 6px 18px #0003; } }
.theme-glass .gift .num { color: #ffd27a; }
.theme-glass .sc { box-shadow: 0 6px 18px #0004; }
.theme-glass .sc .h { background: color-mix(in srgb, var(--sc-tone, #427d9e) 42%, #0d1320) !important; box-shadow: inset 0 2px 0 var(--sc-tone, #427d9e); }
.theme-glass .sc .m { background: color-mix(in srgb, var(--sc-tone, #5a95b5) 22%, #0d1320e6) !important; }
.theme-glass .enter { background: none; box-shadow: inset 2px 0 0 rgb(var(--rgb) / .5); }

/* ===== 文字设置（网址里的 font/fw/lh/ls/color/name_color/stroke/glow，设置页「文字」那一页） ===== */
/* 描边和阴影都用 text-shadow 画：OBS 自带的浏览器比较旧，-webkit-text-stroke 会把字吃细 */
.txt, .lm, .sc .m { font-weight: var(--fw, 400); line-height: var(--lh, 1.5); }
.txt, .lm { letter-spacing: var(--ls, .01em); }
.ts .it, .ts .lcard, .ts.theme-luna .dm .txt, .ts .sc, .ts.no-sc-bg .sc, .ts .guardbuy.artbanner, .ts .llv, .ts .lpill, .ts .lk, .ts .lw, .ts .lcap { text-shadow: var(--ts) !important; }
/* 渐变色的字（提督、总督）透明底，text-shadow 会盖住渐变：改用 filter 画外圈 */
.ts.theme-luna .dm.g2 .txt, .ts.theme-luna .dm.g1 .txt, .ts.theme-glass .it.g2 .name, .ts.theme-glass .it.g1 .name { text-shadow: none !important; filter: var(--tsf); }
.tc .txt, .tc .lm, .tc .sc .m, .tc .giftverb, .tc.no-sc-bg .sc { color: var(--tc) !important; }
.tc.theme-luna .dm.g2 .txt, .tc.theme-luna .dm.g1 .txt { background: none; -webkit-text-fill-color: var(--tc); }
.nc .name, .nc .lw { color: var(--nc) !important; }
.tc .gift .body { color: var(--tc) !important; }
/* 礼物卡、SC 卡里的字（card_color） */
.cc .gift .body, .cc .giftverb, .cc .lcard .lm, .cc .sc .m, .cc.no-sc-bg .sc { color: var(--cc) !important; }
/* 舰长 / 提督 / 总督各自的名字颜色（c3/c2/c1）和弹幕颜色（t3/t2/t1），比上面统一的颜色优先 */
.cn3 .it.g3 .name, .cn3 .it.g3 .lw, .cn2 .it.g2 .name, .cn2 .it.g2 .lw, .cn1 .it.g1 .name, .cn1 .it.g1 .lw { background: none; }
.cn3 .it.g3 .name, .cn3 .it.g3 .lw { color: var(--cn3) !important; -webkit-text-fill-color: var(--cn3); }
.cn2 .it.g2 .name, .cn2 .it.g2 .lw { color: var(--cn2) !important; -webkit-text-fill-color: var(--cn2); }
.cn1 .it.g1 .name, .cn1 .it.g1 .lw { color: var(--cn1) !important; -webkit-text-fill-color: var(--cn1); }
.ct3 .dm.g3 .txt, .ct2 .dm.g2 .txt, .ct1 .dm.g1 .txt { background: none; }
.ct3 .dm.g3 .txt { color: var(--ct3) !important; -webkit-text-fill-color: var(--ct3); }
.ct2 .dm.g2 .txt { color: var(--ct2) !important; -webkit-text-fill-color: var(--ct2); }
.ct1 .dm.g1 .txt { color: var(--ct1) !important; -webkit-text-fill-color: var(--ct1); }
.nc.theme-glass .it.g2 .name, .nc.theme-glass .it.g1 .name { background: none; -webkit-text-fill-color: var(--nc); }

<body>
<div id="list"></div>
<script>
// ---------- 网址参数（都可以不写；用 /obs-setup 页面调最方便） ----------
// size=18       字号（像素）
// max=12        同时最多显示几条
// fade=0        每条显示多少秒后淡出，0 = 不淡出（SC 停留 3 倍、上舰 2 倍时间）
// style=card    card = 圆角卡片，plain = 只有文字（带描边）
// bubble=1     弹幕/礼物/进房卡片底色（0=关），不影响整页透明
// border=1     卡片边框；shadow=0 卡片阴影；sc_bg=1 SC底色
// frame=1      专属头像框；badge=1 头像前身份徽章；rank=1 身份文字；names=1 用户名
// avatar_size=46 头像尺寸；gap=10 弹幕间距；radius=12 圆角
// layout=stacked 名字与正文分行，inline 同行；width=full 整行，fit 随内容
// demo=static  固定样例（仅预览使用）
// bg=70         卡片底色的不透明度 0~100
// light=0       1 = 浅色卡片

  const frame = g ? `<img class="avatar-frame" src="art/frame${g}-v2.png?v=3" alt="" onerror="this.parentElement.classList.remove('has-art');this.remove()">` : '';
  return `<span class="identity${g ? ' tier' + g : ''}">${noBadge ? '' : gtag(g)}<span class="portrait${g ? ' has-art' : ''}">${avatar(face, name)}${frame}</span></span>`;
}
const rankLabel = g => GN[g] ? `<span class="rank rank${g}">${GN[g]}</span>` : '';
function scColor(p) {
  if (p >= 2000) return ['#ab1a32', '#c43450']; if (p >= 1000) return ['#e54d4d', '#ef7272'];
  if (p >= 500) return ['#e09443', '#eaa964']; if (p >= 100) return ['#e2b52b', '#e8c34c'];
  if (p >= 50) return ['#427d9e', '#5a95b5']; return ['#2a60b2', '#4778c4'];
}
const yuan = n => '¥' + (Math.round(n * 100) / 100);

// 加一条；太多了把最老的去掉；设置了 fade 就到时间淡出（stay = 停留时间的倍数）
// 新的一条进来时，上面已有的几条一起平滑地往上挪（先把整列放回原位，再滑到新位置），不再一下跳上去
const GLIDE = !document.body.classList.contains('anim-none') && !matchMedia('(prefers-reduced-motion: reduce)').matches;
function glide(h) {
  if (!GLIDE || !h) return;
  const cur = new DOMMatrixReadOnly(getComputedStyle($list).transform).m42 || 0;
  $list.style.transition = 'none';
  $list.style.transform = `translateY(${cur + h}px)`;
  void $list.offsetHeight;
  $list.style.transition = `transform ${getComputedStyle(document.documentElement).getPropertyValue('--anim-ms').trim() || '.6s'} cubic-bezier(.22, 1, .36, 1)`;
  $list.style.transform = 'translateY(0)';
}
// 2026-11-25 刷屏不卡：同一帧里来的几条攒起来一次放进去，只排一次版、只滑一次；
// 一秒超过 6 条就不放进场动画（body.flood），安静 3 秒后恢复
let pending = [], flushing = 0, recentAdds = [], floodT = 0;
// OBS 里这个源被隐藏（眼睛关掉 / 切到没有它的场景）时不画，只留最后几条，显示出来时一次补上，省电脑（2026-11-25）
let srcHidden = false;
addEventListener('obsSourceVisibleChanged', e => { srcHidden = !e.detail?.visible; if (!srcHidden && pending.length && !flushing) flushing = requestAnimationFrame(flushAdds); });
function flushAdds() {
  flushing = 0;
  if (srcHidden) { pending = pending.filter(el => !el._drop).slice(-opt.max); return; }
  const items = pending.splice(0).filter(el => !el._drop);
  if (!items.length) return;
  const frag = document.createDocumentFragment();
  for (const el of items) { el._pending = false; frag.append(el); }
  $list.append(frag);
  if (!B.contains('flood')) {
    const gap = parseFloat(getComputedStyle($list).rowGap) || 0;
    glide(items.reduce((h, el) => h + el.offsetHeight + gap, 0));

}
function add(html, cls = '', key = '', stay = 1) {
  const el = document.createElement('div');
  el.className = 'it ' + cls;
  if (key) el.dataset.k = key;
  if (curUid) el.dataset.uid = curUid;
  el.innerHTML = html;
  if (PLAT_LABEL[curPlat]) el.querySelector('.name')?.insertAdjacentHTML('afterend', `<span class="plat p-${curPlat}">${PLAT_LABEL[curPlat]}</span>`);
  const now = performance.now();
  recentAdds.push(now);
  while (recentAdds.length && now - recentAdds[0] > 1000) recentAdds.shift();
  if (recentAdds.length > 6) { B.add('flood'); clearTimeout(floodT); floodT = setTimeout(() => B.remove('flood'), 3000); }
  el._pending = true;
  pending.push(el);
  if (pending.length > opt.max) pending.shift()._drop = true;  // 一帧里来的比能显示的还多：最早的直接不上屏
  if (!flushing) flushing = requestAnimationFrame(flushAdds);
  if (opt.fade > 0) setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 700); }, opt.fade * stay * 1000);
  return el;
}
function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
const recent = new Map();  // 弹幕内容 -> 屏幕上那一条，用来合并一样的弹幕
const blocked = text => opt.block.length > 0 && opt.block.some(w => String(text ?? '').toLowerCase().includes(w));
// 弹幕里夹的小表情（[妙]、[哇] 这种）换成图：B 站在每条弹幕里给了图片地址，见过的都记在 EMO 里，旧弹幕也能显示
const EMO = {};
function emoText(d) {
  const map = d.emots ? Object.assign(EMO, d.emots) : EMO;
  const s = esc(d.text);
  return s.includes('[') ? s.replace(/\[[^\[\]\s]{1,12}\]/g, k => map[k] ? `<img class="emo" src="img?u=${encodeURIComponent(map[k])}" alt="${k}" title="${k}">` : k) : s;
}
function showDm(d, quiet) {
  if (d.kind) return;  // 禁言提示只在雾幕里显示，不上直播画面
  if (!opt.bot && botUids.includes(d.uid)) return;
  if (blocked(d.text)) return;
  if (opt.merge && !d.emoticon && !d.guard) {
    const r = recent.get(d.text);
    if (r && (r.el.isConnected || r.el._pending) && !r.el.classList.contains('out') && Date.now() - r.t < 10000) {
      r.n++; r.t = Date.now();
      let b = r.el.querySelector('.rep');
      if (!b) { b = document.createElement('span'); b.className = 'rep'; (XW ? r.el.querySelector('.txt') : r.el.querySelector('.body')).append(b); }  // 新样式：「×2」跟在字后面，不掉到下一行
      b.textContent = '×' + r.n; bump(b);
      return;
    }
  }
  const txt = d.emoticon ? `<img src="img?u=${encodeURIComponent(d.emoticon)}" alt="${esc(d.text)}">` : emoText(d);
  const html = XW ? xwDm(d, txt)
    : LUNA
    ? `<div class="body"><div class="lw"><span class="lav">${avatar(d.face, d.name)}</span>${d.guard ? gtag(d.guard) : ''}<span class="name">${esc(d.name)}</span>${wealth(d)}${medal(d)}</div><span class="txt">${txt}</span></div>`
    : `${identity(d.face, d.name, d.guard)}<div class="body"><span class="who"><span class="name">${esc(d.name)}</span>${wealth(d)}${medal(d)}${rankLabel(d.guard)}</span><span class="txt">${txt}</span></div>`;
  const el = add(html, 'dm' + (d.guard ? ' g' + d.guard : ''));
  if (d.guard === 1 && !quiet) el.classList.add('shine');
  if (quiet) { el.style.animation = 'none'; $list.style.transition = 'none'; $list.style.transform = ''; }
  if (opt.merge && !d.emoticon && !d.guard) {
    recent.set(d.text, { el, n: 1, t: Date.now() });
    if (recent.size > 60) recent.delete(recent.keys().next().value);
  }
}
function giftHtml(g) {
  const name = g.blind ? `${esc(g.blind)} 爆出 ${esc(g.gift)}` : esc(g.gift);
  const gimg = g.img ? `<img class="gi" src="img?u=${encodeURIComponent(g.img)}">` : '';
  if (XW) return `${XMC}<span class="xbadge">${avatar(g.face, g.name)}</span><div class="body"><span class="name">${esc(g.name)}</span><div class="gl2">投喂 <b>${name}</b><span class="num"> ×${g.num}</span></div></div>${gimg}${opt.price ? `<span class="yen">${yuan(g.yuan)}</span>` : ''}<i class="deco"></i>`;
  if (LUNA) return `${identity(g.face, g.name, g.guard, true)}<div class="lb"><div class="lk">PRESENT</div><span class="name">${esc(g.name)}</span><div class="lm">${name}<span class="num"> ×${g.num}</span></div></div>${g.img ? `<img class="gi" src="img?u=${encodeURIComponent(g.img)}">` : ''}${opt.price ? `<span class="wm">${yuan(g.yuan)}</span>` : ''}`;
  return `${identity(g.face, g.name, g.guard, true)}<div class="body"><span class="who"><span class="name">${esc(g.name)}</span>${rankLabel(g.guard)}</span><span class="giftverb">送出</span> ${name}<span class="num">×${g.num}</span>${opt.price ? `<span class="yuan">${yuan(g.yuan)}</span>` : ''}</div>${g.img ? `<img class="gi" src="img?u=${encodeURIComponent(g.img)}">` : ''}`;
}
function showGift(g) {
  if (!opt.gifts || g.gm_ok === false || (g.yuan != null && g.yuan < opt.giftMin)) return;
  // 连击：同一个礼物的那条还在屏幕上就只改数量，跳一下
  const old = $list.querySelector(`[data-k="g${CSS.escape(String(g.id))}"]`);
  if (old) {
    old.innerHTML = giftHtml(g);
    bump(old.querySelector('.num'));
    $list.append(old);  // 挪到最下面（最新）
    return;
  }
  const big = g.big ?? g.yuan >= 50;
  add(giftHtml(g), (LUNA ? 'lcard ' : XW ? 'xgift ' : '') + 'gift' + (big ? ' big' : '') + (g.guard ? ' g' + g.guard : ''), 'g' + g.id, big ? 2 : 1);
}
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).join(' ');
function showSc(s) {
  if (!opt.sc || blocked(s.text)) return;
  const [c1, c2] = scColor(s.price);
  if (XW) { add(`<div class="st"><span class="cap">SUPER CHAT</span><span class="name">${esc(s.name)}</span><span class="p">¥${s.price}</span></div><div class="sb">${esc(s.text)}</div>`, 'xsc', '', 3).style.setProperty('--tone', hexRgb(c1)); return; }
  if (LUNA) {
    const el = add(`${identity(s.face, s.name, s.guard, true)}<div class="lb"><div class="lk">SUPER CHAT</div><span class="name">${esc(s.name)}</span><div class="lm">${esc(s.text)}</div></div><span class="wm">¥${s.price}</span>`, 'lcard sc-l', '', 3);
    el.style.setProperty('--tone', hexRgb(c2));
    return;
  }
  add(`<div class="h" style="--sc-tone:${c1};background:${c1}">${identity(s.face, s.name, s.guard, true)}<span class="name" style="color:#fff">${esc(s.name)}</span>${rankLabel(s.guard)}<span class="p">${yuan(s.price)}</span></div><div class="m" style="--sc-tone:${c2};background:${c2}">${esc(s.text)}</div>`, 'sc', '', 3);
}
function showGuard(g) {
  if (!opt.guardbuy) return;
  if (XW) { add(`${XSTAR}<div class="lv">${g.level_name}</div><div class="who2"><span class="name">${esc(g.name)}</span> · 开通了 ${g.num}${esc(g.unit)}</div>`, `xbuy g${g.level}`, '', 2); return; }
  if (LUNA && (str('buy', 'banner') === 'badge' || !art['banner' + g.level])) {
    // 徽章式：中间一个大船锚徽章（舰长单圈 / 提督双圈 / 总督双圈 + 光芒），下面等级和名字
    const icon = art['guard' + g.level] ? `<img src="${art['guard' + g.level]}" alt="">` : avatar('', g.name);
    add(`<div class="emb">${g.level === 1 ? '<span class="rays"></span>' : ''}${icon}</div><div class="lcap">WELCOME ABOARD</div><div class="llv">${g.level_name}</div><div class="lpill">${esc(g.name)} · ${g.num}${esc(g.unit)}</div>`,
      `lguard l${g.level}${g.level === 1 ? ' shine' : ''}`, '', 2);

  }

    const el = add(`<div class="body"><div class="l1">${esc(g.name)}</div><small>开通了${g.level_name} · ${g.num}${esc(g.unit)}</small></div>`, `guardbuy artbanner l${g.level}`, '', 2);

  const av = el.querySelector('.av');

function showEnter(e) {

  if (opt.enter !== 'all' && !e.guard) return;

  if (XW) { add(`${XSTAR}<span>${e.guard ? `欢迎${GN[e.guard]} ` : ''}<span class="name">${esc(e.name)}</span> 进入直播间</span>`, 'enter' + (e.guard ? ' g' + e.guard : ''), 'e' + e.uid); return; }
  add(`${identity(e.face, e.name, e.guard)}<div class="body">${e.guard ? `欢迎${GN[e.guard]} ` : ''}<span class="name">${esc(e.name)}</span> 进入直播间</div>`, 'enter' + (e.guard ? ' g' + e.guard : ''), 'e' + e.uid);
}
// 雾幕上线了新版：OBS 里这一页自己刷新，不用手动点「刷新」
let myVer = 0;
function checkVer(v) {
  const n = v?.['obs.html'];
  if (!n || opt.demo) return;
  if (!myVer) { myVer = n; return; }
  if (n !== myVer) location.reload();
}
let curUid = 0, curPlat = '';  // curPlat：其他平台（斗鱼 / 虎牙）的，名字后面标一下（2026-11-25）
const PLAT_LABEL = { douyu: '斗鱼', huya: '虎牙' };  // 正在上屏的这条是谁的：没头像的话，后台查到会推 face 过来补（2026-11-25）
function handle(type, data) {
  if (type === 'emots') { Object.assign(EMO, data); return; }
  if (type === 'face') {
    $list.querySelectorAll(`[data-uid="${Number(data.uid) || 0}"] span.av`).forEach(sp => { sp.outerHTML = `<img class="av" src="img?u=${encodeURIComponent(data.face)}" alt="">`; });
    return;
  }
  curUid = Number((data && (data.item?.uid ?? data.uid)) || 0);
  curPlat = (data && (data.item?.plat ?? data.plat)) || '';
  if (type === 'ver') { checkVer(data); return; }
  if (type === 'snapshot') {
    checkVer(data.ver);
    Object.assign(EMO, data.emots || {});
    botUids = data.bot_uids || [];
    realRoom = data.room?.room_real || data.room_id || 0;
    // 刚打开（或 OBS 刷新）时先把最近几条弹幕摆上，不做动画
    $list.innerHTML = ''; recent.clear();
    (data.dm || []).slice(-Math.min(opt.max, 8)).forEach(d => showDm(d, true));
  } else if (type === 'room') realRoom = data.room_real || realRoom;
  else if (type === 'dm') showDm(data);
  else if (type === 'gift') showGift(data.item);
  else if (type === 'sc') showSc(data.item);
  else if (type === 'guard') showGuard(data.item);
  else if (type === 'enter' || type === 'enter_update') showEnter(data);
}
// 设置页的「发一条试试」按钮会发消息过来
addEventListener('message', e => { if (e.origin === location.origin && e.data?.type) handle(e.data.type, e.data.data); });

// ---------- 演示模式：自己造假弹幕 ----------
function demo() {
  realRoom = 1000001;
  if (str('demo', '0') === 'static') {
    setTimeout(() => {
      const people = [['雾里看花',0,8,'主播晚上好～今天唱什么呀',12],['路过的舰长',3,21,'来了来了，今晚也陪你听歌。',24],['紫色提督',2,25,'这首歌的氛围好温柔。',33],['橙色总督',1,30,'把今天的好心情都留在这里。',46]];
      people.forEach(([name,guard,medal_level,text,wealth],i)=>showDm({uid:8000+i,name,guard,medal:'粉丝团',medal_level,medal_room:1000001,text,face:'',wealth},true));
      showGift({id:'sample-gift',uid:8004,name:'主播的猫',face:'',gift:'情书',num:2,yuan:104,guard:3});
      showSc({uid:8005,name:'冬天的鱼',face:'',price:50,text:'主播辛苦啦，今天的歌超好听～',guard:0});
    }, 400);
    return;
  }

  const texts = ['主播晚上好～', '这首好好听！', '哈哈哈哈哈', '唱晴天吗', '来了来了', '主播今天好可爱', '打卡', '想听稻香', '好听好听好听', '下一首唱什么呀'];
  const pick = a => a[Math.floor(Math.random() * a.length)];

    setTimeout(step, 700 + Math.random() * 1100);

  setTimeout(() => { for (let k = 0; k < 5; k++) { const u = user(); handle('dm', { uid: u.uid, name: u.name, face: '', text: pick(texts), medal: '粉丝团', medal_level: u.lv, medal_room: 1000001, guard: u.g, wealth: u.w, emoticon: '' }); } step(); }, 400);
}

// ---------- 连接（断了自动重连） ----------
let retry = 0;
function connect() {
  // 后台照网址里的设置挑着发：没开「显示价格」就不发礼物价格，只告诉大不大、够不够最低价；room = 切房名单里的别的直播间（2026-11-21）
  const q = new URLSearchParams({ client: 'obs', price: opt.price ? '1' : '0', gm: String(opt.giftMin || 0) });
  if (/^\d{1,12}$/.test(str('room', ''))) q.set('room', str('room', ''));
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + location.pathname.replace(/[^/]*$/, '') + 'ws?' + q);
  ws.onopen = () => { retry = 0; };
  ws.onclose = () => setTimeout(connect, Math.min(30000, 2000 * 2 ** retry++));
  ws.onmessage = ev => { const m = JSON.parse(ev.data); handle(m.type, m.data); };
}
if (opt.demo) demo(); else connect();
