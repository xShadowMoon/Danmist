<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/art/icon-64.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBS 弹幕设置 · 弹幕姬</title>
<link rel="stylesheet" href="static/fonts/fonts.css">
<style>
:root { --bg: #eef4fa; --sheet: #fbfdff; --line: #d8e4ef; --ink: #23364a; --ink2: #5d7186; --ink3: #8fa2b5; --mist-d: #4a8cc4; --chip: #e3eef9; --input: #fff; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1520; --sheet: #172231; --line: #2a3a50; --ink: #e2ebf4; --ink2: #a8b9ca; --ink3: #74889e; --mist-d: #8cc0ef; --chip: #1d3350; --input: #101925; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.5 "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--bg); display: flex; }
button, input, select { font: inherit; color: inherit; }
#panel { width: 400px; max-width: 100%; flex: none; background: var(--sheet); border-right: 1px solid var(--line); display: flex; flex-direction: column; height: 100%; }
#panel > header { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
#panel h1 { margin: 0; font-size: 18px; }
#panel h1 small { font-weight: 400; color: var(--ink3); font-size: 12px; margin-left: 6px; }
#panel .sub { color: var(--ink3); font-size: 12px; margin-top: 2px; }
#fields { flex: 1; overflow-y: auto; padding: 4px 18px 16px; }
h3 { font-size: 12px; color: var(--ink3); font-weight: 600; margin: 16px 0 6px; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.opt { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
.opt > span:first-child { flex: 1; min-width: 0; }
.opt small { color: var(--ink3); font-size: 12px; }
.opt input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--mist-d); margin: 0; flex: none; }
.opt input[type=range] { width: 150px; accent-color: var(--mist-d); }
.opt input[type=number] { width: 70px; }
.opt select, .opt input[type=number], .opt input[type=text] { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--input); outline: none; }
/* 拖条：− 拖条 ＋ 数字框 单位（2026-11-19） */
.opt.rng input[type=range] { flex: 1; min-width: 40px; width: auto; }
.opt > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt.rng > span:first-child { flex: none; width: 6.4em; }
.opt.rng .stp { flex: none; width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 7px; background: var(--input); color: var(--ink2); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
.opt.rng .stp:hover { color: var(--mist-d); border-color: var(--mist); }
.opt.rng .nv { width: 58px; text-align: right; padding: 3px 6px; font-variant-numeric: tabular-nums; }
.opt.rng .u { flex: none; width: 3.2em; white-space: nowrap; }
.opt .val { width: 52px; text-align: right; color: var(--ink2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--input); color: var(--ink2); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--mist-d); color: var(--mist-d); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn.go { background: var(--mist-d); border-color: var(--mist-d); color: #fff; font-weight: 600; }
#out { border-top: 1px solid var(--line); padding: 12px 18px 14px; background: var(--chip); }
#url { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--input); font-size: 12px; font-family: Consolas, monospace; }
#out .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
#out .how { color: var(--ink2); font-size: 12px; margin-top: 8px; line-height: 1.6; }
#stage { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--sheet); }
#bar .sp { flex: 1; }
#view { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; padding: 14px; }
#frame { position: relative; flex: none; border-radius: 10px; overflow: hidden; outline: 2px dashed var(--mist-d); outline-offset: 3px; transform-origin: center; }
#frame iframe { color-scheme: light; position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
#frame.dark { background: radial-gradient(800px 500px at 70% 30%, #3b5d7a, transparent), linear-gradient(160deg, #1d2b3a, #44506a 50%, #2b2f45); }
#frame.lightbg { background: linear-gradient(160deg, #f6e9da, #cfe3f2 60%, #f1f5fa); }
#frame.checker { background: repeating-conic-gradient(#d9dee4 0% 25%, #f5f7f9 0% 50%) 0 0 / 24px 24px; }
@media (max-width: 860px) { body { flex-direction: column; height: auto; } #panel { width: 100%; height: auto; border-right: 0; } #fields { overflow: visible; } #stage { height: 90vh; } }
.tabs { display: flex; gap: 6px; padding: 10px 18px 0; }
.tabs button { flex: 1; border: 1px solid var(--line); background: var(--input); color: var(--ink2); border-radius: 10px; padding: 7px 0; cursor: pointer; }
.tabs button.on { background: var(--chip); border-color: var(--mist-d); color: var(--mist-d); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 9px 8px; padding: 6px 0; }
/* 2026-11-19 分组小标题：组和组之间一条细线隔开，行距拉开 */
h4.grp { margin: 18px 0 6px; padding-top: 14px; border-top: 1px solid var(--line-soft, var(--line)); font-size: 12px; font-weight: 700; color: var(--mist-d); letter-spacing: 1px; }
.pick + h4.grp { border-top: 0; padding-top: 4px; margin-top: 12px; }
#fields > h4.grp:first-child { border-top: 0; padding-top: 0; margin-top: 8px; }
.chip { cursor: pointer; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span, .seg button, .pick button { display: inline-block; border: 1px solid var(--line); background: var(--input); color: var(--ink3); border-radius: 999px; padding: 4px 11px; font-size: 13px; white-space: nowrap; cursor: pointer; }
.chip input:checked + span, .seg button.on, .pick button.on { background: var(--chip); border-color: var(--mist-d); color: var(--mist-d); font-weight: 600; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
.seg.fonts { justify-content: flex-start; } .seg.fonts button { font-size: 15px; padding: 4px 12px; }
.opt:has(.seg) { flex-wrap: wrap; }
.opt:has(.seg) > span:first-child { flex: none; white-space: nowrap; }  /* 选项多时整排换到下一行，标题不再被挤成两行 */
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 6px; padding: 10px 0 4px; }
.pick button { border-radius: 12px; padding: 8px 0 6px; text-align: center; line-height: 1.3; }
.pick button i { display: block; font-style: normal; font-size: 20px; }
.sw { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.sw.on { border-color: var(--mist-d); }
.sw.checker { background: repeating-conic-gradient(#d9dee4 0% 25%, #f5f7f9 0% 50%) 0 0 / 10px 10px; }
.sw.dark { background: linear-gradient(160deg, #1d2b3a, #44506a); }
.sw.lightbg { background: linear-gradient(160deg, #f6e9da, #cfe3f2); }
.sws { display: inline-flex; gap: 3px; flex: none; }
.swc { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); padding: 0; cursor: pointer; }
.swc.on { outline: 2px solid var(--mist-d); outline-offset: 1px; }
.opt input[type=color] { width: 38px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; flex: none; }
.modes { display: flex; gap: 4px; margin: 10px 18px 0; padding: 3px; border-radius: 12px; background: var(--chip); }
.modes button { flex: 1; border: 0; background: transparent; color: var(--ink2); border-radius: 9px; padding: 7px 0; cursor: pointer; font-weight: 600; }
.modes button.on { background: var(--sheet); color: var(--mist-d); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
body.songs .tgrp:not(#backdrop), body.songs #fixedchip { display: none; }
.tgrp { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--input); }
.tgrp b { font-size: 12px; font-weight: 600; color: var(--ink3); margin-right: 4px; white-space: nowrap; }
.tgrp .btn { border-color: transparent; background: var(--chip); color: var(--ink2); }
.tgrp .btn:hover { border-color: var(--mist-d); color: var(--mist-d); }
.tgrp .btn.g3 { color: #3f7fd8; } .tgrp .btn.g2 { color: #8a52c8; } .tgrp .btn.g1 { color: #d06a2c; }
.sep { width: 1px; height: 20px; background: var(--line); }
svg.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
h1 svg.ic { width: 20px; height: 20px; color: var(--mist-d); }
.pick i svg.ic { width: 20px; height: 20px; }
/* 2026-11-21 跟主页面设置统一（参考 OBS / PR）：左边分类、右边一页；每页带标题的框，名字一列、控件一列对齐；数字拖着改、点一下打字；改过的加粗 + ↺ */
@media (min-width: 861px) { #panel { width: 600px; } }
#pwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 112px minmax(0, 1fr); }
#pnav { display: flex; flex-direction: column; gap: 2px; padding: 10px 6px; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--chip) 40%, transparent); overflow-y: auto; }
#pnav button { position: relative; display: flex; align-items: center; gap: 7px; padding: 7px 9px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--ink2); cursor: pointer; text-align: left; font-size: 13.5px; }
#pnav button svg.ic { width: 16px; height: 16px; color: var(--mist-d); flex: none; }
#pnav button:hover { background: var(--input); }
#pnav button.on { background: var(--input); border-color: var(--line); box-shadow: inset 3px 0 0 var(--mist-d); color: var(--ink); font-weight: 700; }
#pnav button i.dot { position: absolute; right: 7px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #e88aa8; }
#pnav button i.dot[hidden] { display: none; }
#fields { overflow-y: auto; }
.ptitle { margin: 4px 0 10px; font-size: 17px; }
fieldset { border: 1px solid var(--line); border-radius: 10px; background: var(--input); margin: 0 0 12px; padding: 4px 12px 8px; min-width: 0; }
legend { font-size: 12px; font-weight: 700; color: var(--mist-d); padding: 0 6px; letter-spacing: 1px; }
.opt.r { display: grid; grid-template-columns: 5.6em minmax(0, 1fr) 20px; gap: 10px; align-items: center; min-height: 36px; padding: 3px 0; }
.opt.r + .opt.r { border-top: 1px dashed var(--line); }
.opt.r > span:first-child { text-align: right; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt.r.chg > span:first-child { color: var(--ink); font-weight: 700; }
.opt.r .ctl { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.opt.r .ctl input[type=range] { flex: 1; width: auto; min-width: 60px; max-width: 200px; }
.opt.r .ctl input[type=text] { flex: 1; min-width: 0; }
.opt.r .ctl .seg { margin-left: 0; }
.opt.r .ctl .ccell { margin-left: 0; min-width: 9em; }
.rs { visibility: hidden; border: 0; background: none; color: var(--mist-d); font-size: 15px; cursor: pointer; padding: 0; }
.chg .rs { visibility: visible; }
.scrub { min-width: 3.6em; color: var(--mist-d); font-weight: 600; border-bottom: 1px dashed var(--mist-d); cursor: ew-resize; user-select: none; touch-action: none; white-space: nowrap; }
.scrub small { color: var(--ink3); font-weight: 400; margin-left: 2px; font-size: 11px; }
.scrub:focus-visible { outline: 2px solid var(--mist-d); border-radius: 3px; }
.opt.r .nv { width: 5em; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; background: var(--input); }
/* 一组开关：勾选框排三列 */
.ckg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; padding: 8px 0 6px; }
.ckg label { display: flex; align-items: center; gap: 7px; cursor: pointer; color: var(--ink2); min-width: 0; }
.ckg label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ckg input { width: 15px; height: 15px; accent-color: var(--mist-d); margin: 0; flex: none; }
.ckg label.chg { color: var(--ink); font-weight: 700; }
.pfoot { display: flex; justify-content: flex-end; padding: 2px 0 8px; }
@media (max-width: 860px) { #pwrap { display: block; } #pnav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); } #pnav button { flex: none; white-space: nowrap; } .ckg { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
#panel > header { display: flex; align-items: center; gap: 12px; }
#panel > header .modes { margin: 0 0 0 auto; padding: 3px; width: auto; }
#panel > header .modes button { flex: none; padding: 4px 14px; font-size: 13px; }
#fields { padding: 10px 18px 16px; }
h4.cap { margin: 10px 0 8px; font-size: 12px; font-weight: 700; color: var(--mist-d); letter-spacing: 1px; }
.sec { border: 1px solid var(--line); border-radius: 12px; background: var(--input); margin: 8px 0; }
.sec > .hd { width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 0; background: none; cursor: pointer; text-align: left; color: var(--ink); font-weight: 600; }
.sec > .hd svg.ic { color: var(--mist-d); }
.sec > .hd small { flex: 1; min-width: 0; font-weight: 400; color: var(--ink3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec > .hd::after { content: ""; flex: none; width: 7px; height: 7px; border-right: 1.6px solid var(--ink3); border-bottom: 1.6px solid var(--ink3); transform: rotate(-45deg); margin-right: 4px; transition: transform .15s; }
.sec.open > .hd::after { transform: rotate(45deg); }
.sec > .bd { display: none; padding: 2px 12px 10px; border-top: 1px solid var(--line); }
.sec.open > .bd { display: block; }
/* 颜色：一张小表，点哪格弹出色板 */
.ctab { display: grid; grid-template-columns: 4.6em 1fr 1fr; gap: 6px 10px; align-items: center; padding: 8px 0 2px; }
.ctab.one { grid-template-columns: 4.6em 1fr; }
.ctab .h { font-size: 12px; color: var(--ink3); text-align: center; }
.ccell { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--input); color: var(--ink2); font-size: 12px; cursor: pointer; min-width: 0; }
.ccell i { flex: none; width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
.ccell i.auto { background: conic-gradient(#ffd27a 0 25%, #8ebcff 0 50%, #c7a8ff 0 75%, #fff 0); }
.ccell span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ccell.set { color: var(--ink); }
.ccell:hover, .ccell.open { border-color: var(--mist-d); }
.opt .ccell { margin-left: auto; min-width: 7.5em; }
#cpop { position: fixed; z-index: 80; width: 286px; padding: 10px; border-radius: 12px; background: var(--sheet); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.22); }
#cpop[hidden] { display: none; }
#cpop .t { font-size: 12px; color: var(--ink2); margin-bottom: 8px; }
#cpop .row { display: flex; flex-wrap: wrap; gap: 8px; }
#cpop .swc { width: 24px; height: 24px; }
#cpop .bt { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
#cpop .bt input[type=color] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
#owh { display: inline-flex; align-items: center; gap: 6px; }
#owh input { width: 64px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; background: var(--input); }
#out .how { margin-top: 6px; }
/* 第一次打开的教学（2026-11-19）：圈出按钮 + 一句话；标题旁「?」可以再看 */
#ospot { position: fixed; z-index: 90; pointer-events: none; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(12, 22, 36, .55), 0 0 0 3px var(--mist, #7fb3dd), 0 0 24px 6px var(--mist, #7fb3dd); transition: left .2s, top .2s, width .2s, height .2s; }
#ospot[hidden], #otour[hidden] { display: none; }
#otour { position: fixed; z-index: 91; width: 250px; padding: 12px 14px; border-radius: 14px; background: var(--sheet, #fff); border: 1px solid var(--line, #d8e4ef); box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: 13.5px; color: var(--ink, #23364a); }
#otour .ob { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
#otour .ob span { flex: 1; font-size: 12px; color: var(--ink3, #8fa2b5); }
#ohelp { margin-left: auto; border: 0; background: none; color: var(--ink3, #8fa2b5); cursor: pointer; display: inline-flex; padding: 4px; border-radius: 8px; }
#ohelp:hover { color: var(--mist-d, #4a8cc4); }
#ohelp svg.ic { width: 17px; height: 17px; }
</style>
</head>
<body>
<aside id="panel">
  <header><h1><i class="ic" data-ic="video"></i> OBS</h1><div class="modes" id="modes"><button data-mode="dm" class="on"><i class="ic" data-ic="p-dm"></i> 弹幕</button><button data-mode="songs"><i class="ic" data-ic="music"></i> 歌单</button></div><button id="ohelp" title="怎么用"><i class="ic" data-ic="help"></i></button></header>
  <div id="pwrap"><nav id="pnav"></nav><div id="fields"></div></div>
  <div id="out">
    <input id="url" readonly title="OBS 浏览器源用的网址">
    <div class="row"><button class="btn go" id="copy" title="OBS → 来源 ＋ → 浏览器 → 把网址粘贴进去，宽高照下面填"><i class="ic" data-ic="copy"></i> 复制网址</button><button class="btn" id="reset" title="恢复默认">↺</button><span id="copied" style="color:var(--mist-d);font-size:12px"></span></div>
    <div class="how" id="how"><span id="owh" title="OBS 浏览器源的宽和高，照这里填">宽 <input type="number" id="ow" min="150" max="1920" step="10"> 高 <input type="number" id="oh" min="100" max="1080" step="10"></span></div>
  </div>
</aside>
<main id="stage">
  <div id="bar">
    <span id="backdrop" class="tgrp" style="padding-right:8px;gap:6px" title="只是换右边预览的背景，看看在不同画面上清不清楚。不改样式，也不会进 OBS"><b>预览背景</b><button class="sw checker on" data-bg="checker" title="透明（棋盘格代表透明）"></button><button class="sw dark" data-bg="dark" title="假装后面是深色画面"></button><button class="sw lightbg" data-bg="lightbg" title="假装后面是浅色画面"></button></span>
    <label class="chip" title="用真实直播间的弹幕预览"><input type="checkbox" id="real"><span><i class="ic" data-ic="live"></i> 实时</span></label>
    <label class="chip" id="fixedchip" title="固定一组样例，不滚动"><input type="checkbox" id="fixed" checked><span><i class="ic" data-ic="pin"></i> 固定</span></label><span class="sp"></span>
    <!-- 发一条测试的到右边预览里看效果：按「弹幕 / 礼物 / 上舰」分组，组名写在前面 -->
    <span class="tgrp" title="发一条测试弹幕到预览里"><b><i class="ic" data-ic="p-dm"></i> 弹幕</b><button class="btn sm" data-t="dm">普通</button><button class="btn sm g3" data-t="g3">舰长</button><button class="btn sm g2" data-t="g2">提督</button><button class="btn sm g1" data-t="g1">总督</button></span>
    <span class="tgrp" title="发一条测试礼物 / 醒目留言到预览里"><b><i class="ic" data-ic="p-gift"></i> 礼物</b><button class="btn sm" data-t="gift" title="小花花 ×10（¥1）">小礼物</button><button class="btn sm" data-t="big" title="舰长送的 情书 ×2（¥104）">大礼物</button><button class="btn sm" data-t="sc" title="¥50 醒目留言">SC</button></span>
    <span class="tgrp" title="发一条测试上舰到预览里"><b><i class="ic" data-ic="anchor"></i> 上舰</b><button class="btn sm g3" data-t="buy3">舰长</button><button class="btn sm g2" data-t="buy2">提督</button><button class="btn sm g1" data-t="buy1">总督</button></span>
  </div>
  <div id="view"><div id="frame" class="checker"><iframe id="pv" title="预览"></iframe></div></div>
</main>
<script src="/static/app/icons.js?v=0"></script>
<script>
fillIcons();

try { const b = localStorage.getItem('xw-obs-bg'); if (b && /^(checker|dark|lightbg)$/.test(b)) setBg(b); } catch {}
$('real').onchange = () => { $('fixed').disabled = $('real').checked; update(); };
$('fixed').onchange = update;

// ---------- 「发一条试试」 ----------
let n = 0;
const send = (type, data) => $('pv').contentWindow?.postMessage({ type, data }, location.origin);
const dm = (name, text, guard, lv) => send('dm', { uid: 9000 + (++n), name, face: '', text, medal: '雾锁胃', medal_level: lv, medal_room: 1000001, guard, emoticon: '' });
const T = {
  dm: () => dm('雾里看花', '主播晚上好～今天唱什么呀', 0, 8),
  g3: () => dm('路过的舰长', '来了来了，打卡', 3, 21),
  g2: () => dm('紫色提督', '雾雾今天好可爱', 2, 25),
  g1: () => dm('橙色总督', '主播冲鸭！', 1, 30),
  gift: () => send('gift', { item: { id: 't' + (++n), uid: 1, name: '雪糕不化', face: '', gift: '小花花', num: 10, yuan: 1, img: '', guard: 0, blind: '' } }),
  big: () => send('gift', { item: { id: 't' + (++n), uid: 2, name: '主播的猫', face: '', gift: '情书', num: 2, yuan: 104, img: '', guard: 3, blind: '' } }),
  sc: () => send('sc', { item: { id: ++n, uid: 3, name: '冬天的鱼', face: '', price: 50, text: '主播辛苦啦，今天的歌超好听，早点休息哦～', guard: 0 } }),
  buy3: () => send('guard', { item: { uid: 4, name: '路过的舰长', level: 3, level_name: '舰长', num: 1, unit: '月', yuan: 198 } }),
  buy2: () => send('guard', { item: { uid: 5, name: '紫色提督', level: 2, level_name: '提督', num: 1, unit: '月', yuan: 1998 } }),
  buy1: () => send('guard', { item: { uid: 6, name: '橙色总督', level: 1, level_name: '总督', num: 1, unit: '月', yuan: 19998 } }),
};
document.querySelectorAll('[data-t]').forEach(b => b.onclick = T[b.dataset.t]);

if (window !== window.top) document.querySelector('#panel > header').style.display = 'none';  // 嵌在弹幕姬里时外面已经有标题了
$('modes').onclick = e => { const b = e.target.closest('[data-mode]'); if (b && b.dataset.mode !== mode) setMode(b.dataset.mode); };
if (new URLSearchParams(location.search).get('mode') === 'songs') mode = 'songs';  // 从弹幕姬的歌单直接点过来
setMode(mode);
// 「直播间」能选哪些：跟弹幕姬的切房名单一样（2026-11-21）
fetch('api/xrooms').then(r => r.json()).then(j => {
  const f = F.find(x => x.k === 'room');
  if (!f || !Array.isArray(j.rooms)) return;
  f.opts = [['', j.main?.name || '主播'], ...j.rooms.map(r => [String(r.room), r.name || String(r.room)])];
  if (cfg.room && !f.opts.some(o => o[0] === String(cfg.room))) { cfg.room = ''; }
  draw(); update();
}).catch(() => {});
</script>
<div id="ospot" hidden></div>
<div id="otour" hidden><div id="otxt"></div><div class="ob"><span id="on"></span><button class="btn sm" id="oskip">跳过</button><button class="btn sm go" id="onext">下一步</button></div></div>
<script>
// OBS 设置页教学（2026-11-19）：第一次打开自动走一遍，标题旁「?」可以再看
(() => {
  const STEPS = [
    ['#modes', '先选：做弹幕，还是做歌单'],
    ['#fields .pick', '挑一个样子'],
    ['#pnav', '左边分类，点一下换一页；改过的那页有小红点'],
    ['#frame', '右边就是 OBS 里的样子'],
    ['#bar [data-t="dm"]', '点这些，发一条测试的看看'],
    ['#copy', '复制网址，贴进 OBS 的「浏览器」来源'],
    ['#owh', '宽、高照这里填'],
  ];
  let list = [], i = -1, follow = 0;
  const q = s => document.querySelector(s);
  const place = el => {
    const r = el.getBoundingClientRect(), sp = q('#ospot'), box = q('#otour'), pad = 6, gap = 14;
    Object.assign(sp.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
    const bw = box.offsetWidth, bh = box.offsetHeight;
    let top, left = r.left + r.width / 2 - bw / 2;
    if (r.bottom + gap + bh < innerHeight - 8) top = r.bottom + gap;
    else if (r.top - gap - bh > 8) top = r.top - gap - bh;
    else { top = Math.max(8, Math.min(innerHeight - bh - 8, r.top)); left = r.right + gap + bw < innerWidth - 8 ? r.right + gap : r.left - gap - bw; }
    box.style.top = Math.max(8, top) + 'px'; box.style.left = Math.max(8, Math.min(innerWidth - bw - 8, left)) + 'px';
  };
  const end = () => { clearInterval(follow); i = -1; q('#ospot').hidden = q('#otour').hidden = true; try { localStorage.setItem('xw-obs-tour', '1'); } catch {} };
  const step = k => {
    if (k >= list.length) return end();
    const st = list[k]; try { st[2]?.(); } catch {}
    const el = q(st[0]); if (!el?.getClientRects().length) return step(k + 1);
    i = k; q('#otxt').textContent = st[1]; q('#on').textContent = `${k + 1} / ${list.length}`;
    q('#onext').textContent = k === list.length - 1 ? '知道了' : '下一步';
    q('#ospot').hidden = q('#otour').hidden = false;
    el.scrollIntoView({ block: 'nearest' }); place(el);
    clearInterval(follow); follow = setInterval(() => { const e = q(st[0]); if (e?.getClientRects().length) place(e); }, 250);
  };
  const start = () => { list = STEPS.filter(st => { try { st[2]?.(); } catch {} return q(st[0])?.getClientRects().length; }); step(0); };
  q('#onext').onclick = () => step(i + 1);
  q('#oskip').onclick = end;
  q('#ohelp').onclick = start;
  fillIcons();
  addEventListener('keydown', e => { if (e.key === 'Escape' && i >= 0) end(); });
  let seen = false; try { seen = !!localStorage.getItem('xw-obs-tour'); } catch {}
  if (!seen) setTimeout(start, 1200);
})();
</script>
